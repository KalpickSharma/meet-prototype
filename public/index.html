<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Call AlloyTrik - Prototype</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00d4ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AlloyTrik">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3616/3616215.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 
         * Modern UI Styling
         * Glassmorphism and vibrant accents
         */
        :root {
            --primary: #00d4ff;
            --danger: #ff4757;
            --bg: #0b0b1a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: radial-gradient(circle at top right, #1a1a2e, #0b0b1a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #00d4ff, #00ffcc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #status {
            text-align: center;
            margin: 0 auto 25px;
            padding: 12px 25px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            font-size: 14px;
            width: fit-content;
            color: #aaa;
        }

        #status-text {
            color: #fff;
            font-weight: 600;
        }

        #status-text.success {
            color: #2ed573;
        }

        #status-text.error {
            color: #ff4757;
        }

        /* Video grid */
        #video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            flex-grow: 1;
            width: 100%;
        }

        @media (min-width: 1080px) {
            #video-grid {
                grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            }
        }

        .video-container {
            position: relative;
            background-color: #0f0f23;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 1/1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            transition: transform 0.3s ease;
        }

        .video-container:hover {
            transform: translateY(-5px);
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-container.local {
            border: 2px solid var(--primary);
        }

        /* Screen Sharing specific styles */
        .video-container.sharing-screen {
            aspect-ratio: auto;
            grid-column: 1 / -1;
            /* Make it full width for better view */
            max-height: 80vh;
        }

        .video-container.sharing-screen video {
            object-fit: contain;
            /* Ensure full screen is visible */
            background: #000;
        }

        /* Controls Panel */
        #controls-wrapper {
            position: sticky;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 30px;
            z-index: 100;
        }

        #controls {
            display: flex;
            gap: 15px;
            padding: 15px 30px;
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        button {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 18px;
            background: var(--glass);
            color: #fff;
        }

        #join-btn {
            width: auto;
            padding: 0 25px;
            border-radius: 25px;
            background: var(--primary);
            color: #000;
            font-weight: 700;
            font-size: 14px;
        }

        #join-btn:hover {
            background: #fff;
            transform: scale(1.05);
        }

        button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #leave-btn {
            background: var(--danger);
        }

        #leave-btn:hover:not(:disabled) {
            background: #ff5e6c;
        }

        .toggle-off {
            background: var(--danger) !important;
        }

        /* Tooltip-like behavior or labels for mobile */
        @media (max-width: 600px) {
            #controls {
                gap: 10px;
                padding: 10px 20px;
            }

            button {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>

<body>
    <h1>Meet Call AlloyTrik - Prototype</h1>

    <!-- Status display - shows connection state -->
    <div id="status">
        <span>Status: </span>
        <span id="status-text">Ready to join</span>
    </div>

    <!-- Control buttons -->
    <div id="controls-wrapper">
        <div id="controls">
            <button id="join-btn">Join Room</button>
            <button id="mute-btn" disabled title="Mute/Unmute Audio">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="video-btn" disabled title="Start/Stop Video">
                <i class="fas fa-video"></i>
            </button>
            <button id="share-btn" disabled title="Share Screen">
                <i class="fas fa-desktop"></i>
            </button>
            <button id="pip-btn" disabled title="Picture-in-Picture">
                <i class="fas fa-external-link-alt"></i>
            </button>
            <button id="leave-btn" disabled title="Leave Room">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <!-- Video grid - will contain local and remote videos -->
    <div id="video-grid">
        <!-- Videos will be dynamically added here -->
    </div>

    <!-- Socket.IO client library (served by socket.io server) -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Main WebRTC script -->
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW failed', err));
            });
        }
    </script>
</body>

</html>
